name: Windows build

on:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']
  pull_request:
  # Публикация релиза на GitHub (тег может называться как угодно) — файлы прикрепятся к нему.
  release:
    types: [published]
  # Ручной запуск: можно указать тег уже существующего релиза, чтобы дозагрузить в него файлы.
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Тег релиза, к которому прикрепить файлы (пусто — только собрать)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Версия Node фиксирована: blob SEA внедряется в node.exe ровно этой версии.
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm

      - run: npm ci

      - name: Тесты
        run: npm test

      - name: Сборка MapVault.exe
        run: npm run build:win

      - name: Смоук-тест exe на Windows
        run: node scripts/smoke-test.mjs --exe=dist/MapVault-0.1.0-win-x64/MapVault.exe

      - name: Установщик (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc installer\mapvault.iss

      - uses: actions/upload-artifact@v4
        with:
          name: MapVault-windows
          path: |
            dist/MapVault-*-win-x64.zip
            dist/MapVault-Setup-*.exe

      - name: Файлы в релиз
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.event.release.tag_name || github.ref_name }}
          files: |
            dist/MapVault-*-win-x64.zip
            dist/MapVault-Setup-*.exe
